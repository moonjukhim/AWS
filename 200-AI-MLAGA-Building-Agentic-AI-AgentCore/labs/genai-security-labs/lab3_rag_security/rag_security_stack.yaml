AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GenAI 보안 실습 3 - RAG 보안 기반 인프라.
  고객 관리형 KMS 키, 암호화된 문서 버킷, 인터넷 경로가 없는 프라이빗 VPC,
  Bedrock 인터페이스 VPC 엔드포인트, VPC 안에서만 동작하는 검색 Lambda를 만듭니다.

Parameters:
  LabPrefix:
    Type: String
    Default: gsec
    AllowedPattern: "[a-z0-9-]{2,12}"
    Description: 리소스 이름 접두어 (소문자, 숫자, 하이픈)

Resources:
  # ---------------------------------------------------------------
  # 1. 암호화: 고객 관리형 KMS 키 (자동 교체 활성화)
  # ---------------------------------------------------------------
  RagKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${LabPrefix} RAG data key (documents, vectors, ingestion)"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowS3VectorsIndexing
            Effect: Allow
            Principal: { Service: indexing.s3vectors.amazonaws.com }
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Tags: [{ Key: lab, Value: !Ref LabPrefix }]

  RagKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${LabPrefix}-rag-key"
      TargetKeyId: !Ref RagKey

  # ---------------------------------------------------------------
  # 2. 문서 버킷: SSE-KMS 기본 암호화, 퍼블릭 차단, 버전 관리, TLS 강제
  # ---------------------------------------------------------------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${LabPrefix}-rag-docs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt RagKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }   # 데이터 계보: 어떤 버전의 문서가 답변 근거였는지 추적
      Tags: [{ Key: lab, Value: !Ref LabPrefix }]

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub "${DocsBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------------------------------------------------------
  # 3. 네트워크: 인터넷 게이트웨이·NAT가 없는 프라이빗 VPC
  # ---------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${LabPrefix}-rag-private-vpc" }, { Key: lab, Value: !Ref LabPrefix }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${LabPrefix}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${LabPrefix}-private-b" }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${LabPrefix}-private-rt" }]

  RtAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  RtAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  LambdaSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retrieval Lambda - HTTPS to VPC endpoints only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.20.0.0/16 }

  EndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bedrock interface endpoints - HTTPS from Lambda SG only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LambdaSg }

  # Bedrock 지식 기반 런타임(Retrieve, RetrieveAndGenerate)용 PrivateLink 엔드포인트
  # 엔드포인트 정책은 노트북에서 지식 기반을 만든 뒤 최소 권한으로 좁힙니다.
  AgentRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agent-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  # 모델 호출(InvokeModel, Converse)용 PrivateLink 엔드포인트
  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # ---------------------------------------------------------------
  # 4. VPC 안에서만 동작하는 검색 Lambda (인터넷 경로 없음)
  #    IAM은 Retrieve와 RetrieveAndGenerate를 모두 허용하지만,
  #    노트북에서 엔드포인트 정책으로 Retrieve만 남겨 "네트워크 계층 통제"를 보여줍니다.
  # ---------------------------------------------------------------
  RetrieverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      Policies:
        - PolicyName: kb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:Retrieve, bedrock:RetrieveAndGenerate]
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:GetInferenceProfile]
                Resource: "*"
      Tags: [{ Key: lab, Value: !Ref LabPrefix }]

  RetrieverFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${LabPrefix}-private-retriever"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt RetrieverRole.Arn
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSg]
      Code:
        ZipFile: |
          import boto3
          client = boto3.client("bedrock-agent-runtime")

          def handler(event, context):
              try:
                  if event.get("mode") == "rag":
                      r = client.retrieve_and_generate(
                          input={"text": event["query"]},
                          retrieveAndGenerateConfiguration={
                              "type": "KNOWLEDGE_BASE",
                              "knowledgeBaseConfiguration": {
                                  "knowledgeBaseId": event["kb_id"],
                                  "modelArn": event["model_arn"],
                              },
                          },
                      )
                      return {"ok": True, "answer": r["output"]["text"][:300]}
                  r = client.retrieve(
                      knowledgeBaseId=event["kb_id"],
                      retrievalQuery={"text": event["query"]},
                      retrievalConfiguration={"vectorSearchConfiguration": {"numberOfResults": 2}},
                  )
                  return {"ok": True, "sources": [x["location"].get("s3Location", {}).get("uri") for x in r["retrievalResults"]]}
              except Exception as e:
                  return {"ok": False, "error": str(e)[:400]}
      Tags: [{ Key: lab, Value: !Ref LabPrefix }]

Outputs:
  KmsKeyArn: { Value: !GetAtt RagKey.Arn }
  DocsBucketName: { Value: !Ref DocsBucket }
  VpcId: { Value: !Ref Vpc }
  AgentRuntimeEndpointId: { Value: !Ref AgentRuntimeEndpoint }
  RetrieverFunctionName: { Value: !Ref RetrieverFunction }
  RetrieverRoleArn: { Value: !GetAtt RetrieverRole.Arn }
