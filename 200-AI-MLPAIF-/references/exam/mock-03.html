<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIF-C01 모의고사 3회</title>
<style>
#gate{--g-bg:#faf9f5;--g-surface:#fff;--g-ink:#141413;--g-ink-3:#8a827a;
 --g-line:#e7e3dd;--g-line-strong:#d3cdc4;--g-accent:#4a7c6f;--g-rose:#b4453c;
 --g-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --g-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
 position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;
 background:var(--g-bg);color:var(--g-ink);font-family:var(--g-sans)}
@media (prefers-color-scheme:dark){#gate{--g-bg:#0C1216;--g-surface:#131C21;--g-ink:#E6EDF1;
 --g-ink-3:#7C8E9A;--g-line:#25333B;--g-line-strong:#33454F;--g-accent:#5EC5D6}}
#gate *{box-sizing:border-box}
#gate .box{width:100%;max-width:380px;background:var(--g-surface);border:1px solid var(--g-line);
 border-radius:16px;padding:32px 28px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#gate .lock{font-size:26px;line-height:1;margin:0 0 14px}
#gate h1{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:-.01em}
#gate .sub{margin:0 0 22px;font-size:13px;color:var(--g-ink-3);line-height:1.6}
#gate label{display:block;font-size:12px;font-family:var(--g-mono);color:var(--g-ink-3);margin-bottom:7px}
#gate input{width:100%;padding:11px 13px;font-size:15px;font-family:var(--g-sans);color:var(--g-ink);
 background:var(--g-bg);border:1px solid var(--g-line-strong);border-radius:9px;outline:none}
#gate input:focus{border-color:var(--g-accent)}
#gate button{width:100%;margin-top:12px;padding:11px;font-size:14px;font-weight:600;
 font-family:var(--g-sans);color:#fff;background:var(--g-accent);border:0;border-radius:9px;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:default}
#gate .err{margin-top:12px;font-size:13px;color:var(--g-rose);min-height:18px}
</style></head>
<body>
<div id="gate"><div class="box">
  <p class="lock">&#128274;</p>
  <h1>AIF-C01 모의고사 3회</h1>
  <p class="sub">이 문서는 암호화되어 있습니다.<br>비밀번호를 입력하면 내용이 표시됩니다.</p>
  <form id="f" autocomplete="off">
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="new-password" autofocus>
    <button type="submit" id="go">열기</button>
  </form>
  <div class="err" id="err"></div>
</div></div>

var gate = document.getElementById('gate'),
    err  = document.getElementById('err'),
    go   = document.getElementById('go');

function b2a(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0) }) }

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  if (!pw) return;
  err.textContent = ''; go.disabled = true; go.textContent = '확인 중...';
  unlock(pw).catch(function(){
    err.textContent = '비밀번호가 올바르지 않습니다.';
    go.disabled = false; go.textContent = '열기';
    document.getElementById('pw').select();
  });
});

function unlock(pw){
  if (!window.crypto || !crypto.subtle) {
    return Promise.reject(new Error('no-subtle'));
  }
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:b2a(DATA.s), iterations:DATA.n, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    })
    .then(function(key){
      return crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(DATA.i) }, key, b2a(DATA.c));
    })
    .then(function(plain){
      reveal(new TextDecoder().decode(plain));
    });
}

var revealed = false;
function reveal(html){
  if (revealed) return;   // never inject the exam twice
  revealed = true;
  gate.remove();
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var frag = document.createDocumentFragment();
  while (tmp.firstChild) frag.appendChild(tmp.firstChild);
  // Scripts inserted via innerHTML never run; swap in fresh nodes so they execute.
  var olds = frag.querySelectorAll('script');
  for (var i = 0; i < olds.length; i++) {
    var s = document.createElement('script');
    s.textContent = olds[i].textContent;
    olds[i].parentNode.replaceChild(s, olds[i]);
  }
  document.body.appendChild(frag);
}
</script>
