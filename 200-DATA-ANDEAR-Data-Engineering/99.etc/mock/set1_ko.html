<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의고사 세트 1 (65문항) · 한글판 · DEA-C01 모의고사</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dfe3e8;--ink:#16191f;--sub:#5f6b7a;--accent:#0972d3;--ok:#037f0c;--bad:#d91515;--warn:#b25000;--flag:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:#232f3e;color:#fff;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1rem;margin:0;font-weight:600}
header .sp{flex:1}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;padding:.15rem .55rem;border-radius:5px;background:#37475a}
#timer.warn{background:#7a2b12}
header button{background:#ff9900;color:#16191f;border:0;border-radius:5px;padding:.35rem .8rem;font-weight:700;cursor:pointer;font-size:.85rem}
header button.ghost{background:#37475a;color:#fff;font-weight:500}
header a.home{color:#c9d4e0;font-size:.82rem;text-decoration:none}
header a.home:hover{text-decoration:underline}
header select.setjump{background:#37475a;color:#fff;border:1px solid #4a5b70;border-radius:5px;padding:.3rem .5rem;font-size:.82rem;cursor:pointer;max-width:16rem}
header select.setjump option{background:#232f3e;color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:1fr 250px;gap:1rem;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem}
.qmeta{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem;font-size:.78rem}
.tag{background:#eef3f8;color:#31465f;border-radius:999px;padding:.12rem .6rem;border:1px solid #d5e2f0}
.tag.d1{background:#eaf3fb;border-color:#c5ddf3}.tag.d2{background:#eef8ee;border-color:#c9e7c9}
.tag.d3{background:#fdf3e6;border-color:#f2ddbd}.tag.d4{background:#f7eefb;border-color:#e6d0f2}
.qno{font-weight:700;font-size:.95rem;color:var(--sub)}
.qtext{white-space:pre-wrap;margin:.2rem 0 1rem}
.qtext img{max-width:100%;border:1px solid var(--line);border-radius:6px}
.imgnote{font-size:.8rem;color:var(--warn);background:#fff8f0;border:1px solid #f2ddbd;border-radius:6px;padding:.4rem .6rem;margin:.4rem 0}
ul.choices{list-style:none;margin:0;padding:0}
ul.choices li{margin:.45rem 0}
ul.choices label{display:flex;gap:.65rem;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:.65rem .8rem;cursor:pointer;background:#fff}
ul.choices label:hover{border-color:var(--accent);background:#f7fbff}
ul.choices input{margin-top:.28rem;flex:none}
ul.choices .ltr{font-weight:700;flex:none;width:1.1rem}
label.sel{border-color:var(--accent);background:#f0f7fd;box-shadow:inset 0 0 0 1px var(--accent)}
label.correct{border-color:var(--ok);background:#f0f9f0;box-shadow:inset 0 0 0 1px var(--ok)}
label.wrong{border-color:var(--bad);background:#fdf1f1;box-shadow:inset 0 0 0 1px var(--bad)}
.hint{font-size:.82rem;color:var(--sub);margin:.5rem 0 0}
.nav{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
.nav button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:.45rem .9rem;cursor:pointer;font-size:.9rem}
.nav button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.nav button.flagbtn.on{background:#f4edfd;border-color:var(--flag);color:#5b21b6;font-weight:600}
.side h3{font-size:.82rem;margin:.1rem 0 .5rem;color:var(--sub);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:.72rem;cursor:pointer;padding:0}
.grid button.done{background:#dff0fb;border-color:#8fc5ea}
.grid button.flag{background:#f4edfd;border-color:var(--flag)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.grid button.ok{background:#e3f5e3;border-color:#8ac98a}
.grid button.no{background:#fbe4e4;border-color:#e79a9a}
.legend{font-size:.75rem;color:var(--sub);margin-top:.6rem;line-height:1.9}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:.25rem}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.5rem 0 1rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left}
th{background:#f3f5f7;font-size:.8rem;color:var(--sub)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{background:#e9edf1;border-radius:4px;height:8px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.score{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 1rem}
.score .big{font-size:2.4rem;font-weight:800;line-height:1}
.pill{border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.85rem}
.pill.pass{background:#e3f5e3;color:var(--ok)}.pill.fail{background:#fbe4e4;color:var(--bad)}
a{color:var(--accent)}
.rev{margin:.5rem 0;border:1px solid var(--line);border-radius:9px;background:#fff;padding:.8rem 1rem}
.rev.bad{border-left:4px solid var(--bad)}.rev.good{border-left:4px solid var(--ok)}
.mini{font-size:.82rem;color:var(--sub)}
.notice{background:#fff8f0;border:1px solid #f2ddbd;border-radius:8px;padding:.6rem .8rem;font-size:.83rem;margin:.6rem 0}
.hidden{display:none}
footer{max-width:1180px;margin:0 auto;padding:1rem;color:var(--sub);font-size:.8rem}

#gate{position:fixed;inset:0;z-index:200;background:#232f3e;display:flex;align-items:center;justify-content:center;padding:1rem}
#gate .box{background:#fff;border-radius:12px;padding:1.6rem 1.7rem;max-width:26rem;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#gate h2{margin:0 0 .3rem;font-size:1.05rem}
#gate p{margin:0 0 1rem;font-size:.85rem;color:var(--sub)}
#gate input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:7px;font-size:1rem;font-family:inherit}
#gate button{margin-top:.8rem;width:100%;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:.6rem;font-size:.95rem;font-weight:600;cursor:pointer}
#gate button[disabled]{opacity:.6;cursor:default}
#gateerr{color:var(--bad);font-size:.83rem;margin-top:.6rem;min-height:1.1rem}
@media print{header,.side,.nav{display:none}.wrap{grid-template-columns:1fr}}
</style></head><body>
<div id="gate">
  <div class="box">
    <h2>🔒 암호를 입력하세요</h2>
    <p>이 모의고사의 문항 데이터는 암호화되어 있습니다. 암호를 입력해야 문제를 볼 수 있습니다.</p>
    <input type="password" id="gatepw" autocomplete="current-password" placeholder="암호" autofocus>
    <button type="button" id="gatebtn">잠금 해제</button>
    <div id="gateerr"></div>
  </div>
</div>

<div class="wrap">
  <main>

const b64d = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(ENC.s), iterations:ENC.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(ENC.i)}, key, b64d(ENC.c));
  return JSON.parse(new TextDecoder().decode(plain));
}

    return;
  }
  async function submit(){
    err.textContent = ''; btn.disabled = true; btn.textContent = '확인 중...';
    let data = null;
    try { data = await unlock(pw.value); } catch(e){ data = null; }
    btn.disabled = false; btn.textContent = '잠금 해제';
    if(!data){ err.textContent = '암호가 올바르지 않습니다.'; pw.select(); return; }
    document.getElementById('gate').remove();
    boot(data);
  }
  btn.onclick = submit;
  pw.onkeydown = e => { if(e.key === 'Enter') submit(); };
  pw.focus();
})();

function renderGrid(){

function grade(auto){

  let h='<div class="card"><h2 style="margin:.1rem 0 .3rem">채점 결과 · '+DATA.title+'</h2>';
  if(auto) h+='<div class="notice">제한 시간이 종료되어 자동 채점되었습니다.</div>';
  h+='<div class="score"><div><div class="big">'+pct+'%</div><div class="mini">'+ok+' / '+n+' 정답</div></div>'
    +'<div><span class="pill '+(pass?'pass':'fail')+'">'+(pass?'합격 기준 충족':'합격 기준 미달')+'</span>'
    +'<div class="mini" style="margin-top:.35rem">실제 시험 합격선 720/1000 ≈ 72%</div></div>'
    +'<div class="mini">소요 시간 '+fmt(used)+' / '+DATA.minutes+':00</div></div>';
  function tbl(title,obj,names,extra,order){
    const keys = order ? order.filter(function(k){return obj[k];}) : Object.keys(obj).sort();
    let s='<h3 style="margin:1.1rem 0 .2rem;font-size:.95rem">'+title+'</h3><table><tr><th>영역</th><th class="num">정답</th><th class="num">정답률</th><th style="width:32%"></th></tr>';
    keys.forEach(function(k){ const c=obj[k][0], t=obj[k][1], p=Math.round(c/t*100);
      s+='<tr><td>'+(names[k]||k)+(extra&&extra[k]?' <span class="mini">'+extra[k]+'</span>':'')+'</td><td class="num">'+c+'/'+t+'</td><td class="num">'+p+'%</td>'
        +'<td><div class="bar"><i style="width:'+p+'%;background:'+(p>=72?'#037f0c':(p>=55?'#b25000':'#d91515'))+'"></i></div></td></tr>'; });
    return s+'</table>';
  }
  const w={}; Object.keys(DOMNAME).forEach(function(k){ w[k]='· 시험 비중 '+DATA.weights[k]+'%'; });
  h+=tbl('도메인별 결과',byDom,DOMNAME,w);
  h+=tbl('과제 명세(task statement)별 결과',byTask,TASKNAME);
  h+=tbl('교육 과정 모듈별 결과 — 낮은 모듈부터 복습하세요',byMod,MODNAME,null,DATA.modorder);
  const weak=Object.keys(byMod).filter(function(k){ return byMod[k][0]/byMod[k][1]<0.72; })
    .sort(function(a,b){ return byMod[a][0]/byMod[a][1]-byMod[b][0]/byMod[b][1]; }).slice(0,4);
  if(weak.length) h+='<div class="notice"><b>우선 복습 권장 모듈</b><br>'+weak.map(function(k){ return MODNAME[k]+' ('+byMod[k][0]+'/'+byMod[k][1]+')'; }).join('<br>')+'</div>';
  h+='<p class="mini">문항별 검토에서 원본 토론 페이지 링크를 열면 커뮤니티 풀이 설명을 볼 수 있습니다.</p></div>';
  h+='<div style="margin-top:1rem"><h2 style="font-size:1.05rem">문항별 검토</h2>';
  DATA.questions.forEach(function(q,i){
    const a=st.ans[i]||[], c=a.length>0&&eq(a,q.ans);
    h+='<div class="rev '+(c?'good':'bad')+'" id="rev'+i+'"><div class="qmeta"><span class="qno">'+(i+1)+'.</span>'
      +'<span class="tag d'+q.dom[1]+'">'+TASKNAME[q.dom]+'</span><span class="tag">'+MODNAME[q.mod]+'</span>'
      +'<span class="tag" style="'+(c?'background:#e3f5e3;border-color:#8ac98a':'background:#fbe4e4;border-color:#e79a9a')+'">'
      +(c?'정답':(a.length?'오답':'미응답'))+'</span>'
      +(q.mismatch?'<span class="tag" style="background:#fff3cd;border-color:#ffe08a">커뮤니티 최다 득표: '+q.mismatch+'</span>':'')+'</div>';
    h+='<div class="qtext">'+esc(q.q)+'</div><ul class="choices">';
    q.choices.forEach(function(ch){
      const isc=q.ans.indexOf(ch.l)>=0, sel=a.indexOf(ch.l)>=0;
      h+='<li><label class="'+(isc?'correct':(sel?'wrong':''))+'"><span class="ltr">'+ch.l+'.</span><span>'+esc(ch.t)
        +(isc?' <b style="color:#037f0c">✔ 정답</b>':'')+(sel&&!isc?' <b style="color:#d91515">✘ 내 답</b>':'')+'</span></label></li>';
    });
    h+='</ul><p class="mini">정답 <b>'+q.ans.join(', ')+'</b>'+(a.length?' · 내 답 '+a.join(', '):' · 미응답')
      +(q.votes?' · 커뮤니티 투표 '+esc(q.votes):'')
      +' · <a href="../q'+pad3(q.n)+'.html" target="_blank">원본 문제 · 토론 해설 보기 (#'+q.n+')</a></p></div>';
  });
  h+='</div>';
  $('#resultview').innerHTML=h; $('#resultview').classList.remove('hidden'); $('#examview').classList.add('hidden');
  $('#submitbtn').textContent='결과 보기'; renderGrid();
  window.scrollTo({top:0,behavior:'smooth'});
}
if(st.done) grade(false); else render();
}

</script></body></html>
